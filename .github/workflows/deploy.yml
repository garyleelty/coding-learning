name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hackrust/frontend/package-lock.json

      - name: Install dependencies
        working-directory: hackrust/frontend
        run: npm ci

      - name: Run unit tests
        working-directory: hackrust/frontend
        run: npm run test

      # 每个 code 关卡都必须有一份 rustc 真能编译、输出也对得上的参考实现。
      # 这挡住两类回归：混入中文弯引号导致示例代码编译失败，
      # 以及新增关卡时忘了补 solutionCode（issue #1「缺课件」的根因）。
      - name: Verify every code level has a runnable solution
        run: python3 scripts/verify_solutions.py

      - name: Build
        working-directory: hackrust/frontend
        run: npm run build
        env:
          GITHUB_PAGES: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hackrust/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
